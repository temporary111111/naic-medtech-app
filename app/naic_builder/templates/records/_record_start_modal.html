{% set record_start_return_to = records_mode|default('work') %}
<section
  class="records-start-modal"
  data-record-start-modal
  data-start-open="{{ 'true' if record_start_open else 'false' }}"
  hidden
  aria-hidden="true"
>
  <button class="records-start-modal__scrim" type="button" data-record-start-close aria-label="Close new record picker"></button>

  <div class="panel records-start-modal__dialog" data-record-start-dialog role="dialog" aria-modal="true" aria-labelledby="record-start-title">
    <div class="records-start-modal__head">
      <div class="records-start-modal__copy">
        <p class="eyebrow">New record</p>
        <h2 id="record-start-title">Choose a form</h2>
      </div>
      <button class="ghost-button" type="button" data-record-start-close>Close</button>
    </div>

    {% if record_start_error %}
    <div class="error-banner">{{ record_start_error }}</div>
    {% endif %}

    {% include "records/_record_form_picker.html" %}
  </div>
</section>
